[project]
name = "vk-generative-retrieval"
version = "0.1.0"
description = "Auditable generative retrieval scaffold and P3 data contract"
requires-python = ">=3.11,<3.12"
dependencies = ["PyYAML==6.0.2", "numpy==1.26.4", "pyarrow==19.0.1"]

[project.optional-dependencies]
training = ["torch==2.11.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
